<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Station</title>
    <link rel='stylesheet' type='text/css' media='screen' href='styles/projects.css'>
</head>
<body>
    <div class="backdrop" id="backdrop"><div class="stars-layer"><canvas id="starfield-canvas" class="star-canvas"></canvas></div></div>
    <header>
        <a href="https://www.edase.org" target="_blank" id="logo">
            <img src="./images/logo.png" alt="Site Logo">
            <span>Collaboration Station</span>
        </a>
        <div class="header-actions">
                <a href="shop.html" class="shop-btn shop-btn--icon" aria-label="Profile shop" title="Profile shop">
                    <span class="shop-icon">👤</span>
                </a>
            <button class="new-project-btn" onclick="addProject()">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                New Project
            </button> 
            <button class="new-project-btn new-project-btn--secondary" onclick="joinExistingProjectPopup()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                </svg>
                Join Existing
            </button>
        </div>
    </header>
    <div class="container">
        <div class="main-content">
            <div class="project-card">
                <h2>Current Project</h2>
                <div id="selected-project" class="selected-project">

                </div>
            </div>
            <div class="project-card">
                <h2>My Projects</h2>
                <div class="project-scroll-container">
                    <button id="scroll-left" class="scroll-btn">&lt;</button>
                    <div id="past-projects" class="project-grid">

                    </div>
                    <button id="scroll-right" class="scroll-btn">&gt;</button>
                </div>
            </div>
            <div class="project-card">
                <h2>Shared with me!</h2>
                <div class="project-scroll-container">
                    <button id="scroll-left-class" class="scroll-btn">&lt;</button>
                    <div id="class-projects" class="project-grid">
                        
                    </div>
                    <button id="scroll-right-class" class="scroll-btn">&gt;</button>
                </div>
            </div>
        </div>
        <div class="side-panel">
            <h2>Other Users</h2>
            <ul id="user-list" class="user-list">
                
            </ul>
        </div>
    </div>

    <script type="module">
        import { initStarfield } from './js/starfield-lite.js';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        initStarfield(document.getElementById('starfield-canvas'), {
            density: 3200,
            color: [215, 222, 255],
            twinkleAmp: reduceMotion ? 0 : 0.12,
            planets: [],
        });

        // Subtle scroll parallax on the background layers (see styles/projects.css).
        if (!reduceMotion) {
            const backdrop = document.getElementById('backdrop');
            let queued = false;
            const update = () => {
                queued = false;
                backdrop.style.setProperty('--scroll', Math.min(Math.max(window.scrollY, 0), 1200));
            };
            window.addEventListener('scroll', () => {
                if (!queued) { queued = true; requestAnimationFrame(update); }
            }, { passive: true });
            update();
        }
    </script>
    <script src="js/project.js"></script>
</body>
</html>
